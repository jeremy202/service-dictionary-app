<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment complete · Service Dictionary</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f2ea; --ink:#1b211e; --muted:#69716b; --accent:#2e5c45; --card:#fffefb; --line:#e6e0d3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121513; --ink:#e9ece9; --muted:#98a19a; --accent:#8cc6a5; --card:#1a1e1c; --line:#2a2f2c; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 24px; text-align:center;
          box-shadow: 0 18px 40px -12px rgba(40,36,24,.18); }
  .tick { width:64px; height:64px; border-radius:50%; background:var(--accent); color:var(--card); display:grid; place-items:center; margin:0 auto 16px; }
  h1 { font: 600 24px/1.2 Georgia, serif; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 24px; font-size:15px; }
  a.btn { display:block; background:var(--accent); color:var(--card); text-decoration:none; font-weight:600; padding:14px; border-radius:16px; }
  small { display:block; margin-top:14px; color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
    <h1>Thank you!</h1>
    <p>Your payment is being confirmed. Return to Service Dictionary to start using Premium.</p>
    <a class="btn" id="back" href="servicedictionary://paid">Return to the app</a>
    <small>If the app doesn't open, close this page: the app checks your payment automatically.</small>
  </div>
  <script>
    // Paystack adds ?reference=…&trxref=… to this page's address
    var q = new URLSearchParams(location.search);
    var ref = q.get('reference') || q.get('trxref') || '';
    var link = 'servicedictionary://paid' + (ref ? '?reference=' + encodeURIComponent(ref) : '');
    document.getElementById('back').href = link;
    setTimeout(function () { location.href = link; }, 600);
  </script>
</body>
</html>
