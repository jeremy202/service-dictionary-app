# Service Dictionary payment service (Paystack), hosted on Netlify.
# Setting needed in Netlify (Site configuration → Environment variables):
#   PAYSTACK_SECRET_KEY = sk_test_… (testing) or sk_live_… (real payments)
#   GOOGLE_PLAY_SERVICE_ACCOUNT = JSON key of the Google Play service account (Play Store version)

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/paid"
  to = "/paid.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Store graphics (for uploading to Play Console)
[[headers]]
  for = "/store/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/u-cfdd1cc333f4cd8bc2af86c1/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://play.google.com"
