# Service Dictionary payment service (Paystack), hosted on Netlify.
# Setting needed in Netlify (Site configuration → Environment variables):
#   PAYSTACK_SECRET_KEY = sk_test_… (testing) or sk_live_… (real payments)

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/paid"
  to = "/paid.html"
  status = 200
